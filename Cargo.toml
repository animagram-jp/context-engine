[package]
name = "context-engine"
version = "0.1.7"
edition = "2024"
rust-version = "1.85"
description = "Declarative context management for request handlers"
license = "Apache-2.0"
repository = "https://github.com/animagram-jp/context-engine"
readme = "README.md"
keywords = ["context", "namespace", "yaml", "addressing"]
categories = ["config", "data-structures", "template-engine", "parser-implementations", "web-programming"]
include = ["/src/**", "/docs/**", "/examples/precompile.rs", "/Cargo.toml", "/README.md", "/LICENSE"]

[dev-dependencies]
env_logger = "0.11"

[dependencies]
log              = { version = "0.4", default-features = false, optional = true }
serde_yaml_ng    = { version = "0.10", optional = true }

[package.metadata.docs.rs]
all-features = true

[features]
default    = []
logging    = ["dep:log"]
precompile = ["dep:serde_yaml_ng", "logging"]

[[example]]
name              = "precompile"
required-features = ["precompile"]

[[example]]
name              = "integration_tests"
required-features = ["precompile"]

[lints.rust]
unsafe_op_in_unsafe_fn = "forbid"
unused_must_use        = "deny"

[lints.clippy]
all                             = { level = "deny", priority = -1 }
undocumented_unsafe_blocks      = "forbid"
unnecessary_safety_comment      = "deny"
unnecessary_safety_doc          = "deny"
missing_safety_doc              = "deny"
allow_attributes                = "deny"
allow_attributes_without_reason = "deny"
too_many_arguments              = "allow"
type_complexity                 = "allow"
new_without_default             = "allow"
std_instead_of_core             = "deny"
std_instead_of_alloc            = "deny"
alloc_instead_of_core           = "deny"
