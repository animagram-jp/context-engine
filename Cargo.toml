[package]
name = "context-engine"
version = "0.1.6"
authors = ["Andyou <andyou@animagram.jp>"]
description = "Declarative context management for request handlers"
edition = "2024"
license = "MIT"

repository = "https://github.com/animagram-jp/context-engine"
homepage = "https://github.com/animagram-jp/"
readme = "README.md"
keywords = ["context", "namespace", "yaml", "addressing"]
categories = ["config", "data-structures", "template-engine", "parser-implementations", "web-programming"]
exclude = ["examples/*"]

[dev-dependencies]
env_logger = "0.11"

[dependencies]
log              = { version = "0.4", default-features = false, optional = true }
serde_yaml_ng    = { version = "0.10", optional = true }

[features]
default    = []
logging    = ["dep:log"]
precompile = ["dep:serde_yaml_ng", "logging"]

[[example]]
name              = "precompile"
required-features = ["precompile"]

[[example]]
name              = "integration_tests"
required-features = ["precompile"]
