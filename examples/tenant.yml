session:
  user:
    id:
      _load:
        client: Memory
        key:    "request.authorization.user"
    _load:
      client: TenantDb
      key:    "users.id.${session.user.id}"
      config: ${tenant_db_config}
      map:
        password_hash:         "password_hash"
        name:                  "name"
        email:                 "email"
        is_manager:            "is_manager"
        preference.color_mode: "color_mode"
    password_hash:
    name:
    email:
    is_manager:
    preference:
      color-mode:  

    tenant:
      id:
        _load:
          client: Memory
          key:    "request.authorization.tenant"
      _load:
        client: CommonDb
        config: ${common_db_config}
        key:    "tenants.id.${session.user.tenant.id}"
        map:
          code:        "code"
          name:        "name"
          email:       "email"
          locale:      "locale"
          allowed_ips: "allowed_ips"
      code:
      name:
      email:
      locale:
      allowed_ips:

common_db_config:
  _load:
    client: Env
    map:
      host:     "COMMON_DB_HOST"
      port:     "COMMON_DB_PORT"
      username: "COMMON_DB_USERNAME"
      password: "COMMON_DB_PASSWORD"
  host:
  port:
  username:
  password:
  driver:   "postgres"
  charset:  "UTF8"

tenant_db_config:
  _load:
    client:     CommonDb
    key:        "tenants.id.${session.user.tenant.id}"
    map:
      host:     "host"
      port:     "port"
      username: "username"
      password: "password"
  host:
  port:
  username:
  password:
  driver:   "postgres"
  charset:  "UTF8"